# M2a fixture: hello document — cascade + block layout + deterministic paint.
# Layout facts are asserted structurally (data-vv-test keys); the pixel hash
# only guards "did the final raster change".
name = "hello"
html = "examples/hello/index.html"
css = ["examples/hello/app.css"]
viewport = { width = 800, height = 600, scale = 1.0 }

[expect]
# SHA-256 of the RGBA buffer; regenerate with
#   cargo run -p velqu-lab -- --headless --size 800x600 examples/hello
pixels_sha256 = "b6af24a4dce1af41aa69e601bdfb182f7c8c11e57d4963877c07770f8f76b91a"

# Exact-color probes: page background, card fill, card border.
[[expect.pixel]]
pos = [4, 4]
color = "#10141C"

[[expect.pixel]]
pos = [40, 40]
color = "#171D29"

# Border top edge of the card (border-box starts at x=16, y=16).
[[expect.pixel]]
pos = [16, 17]
color = "#2A3242"

[[expect.facts]]
id = "card"
tag = "main"
display = "block"
x = 16.0
y = 16.0
width = 436.0            # 2 border + 16 padding + 400 width + 16 padding + 2 border
padding = [16.0, 16.0, 16.0, 16.0]  # device px (scale 1)
border = [2.0, 2.0, 2.0, 2.0]
margin = [16.0, 16.0, 16.0, 16.0]
content_x = 34.0
content_y = 34.0
content_width = 400.0

[[expect.facts]]
id = "title"
tag = "h1"
display = "block"
text_runs = ["Hello, VelquView"]

[[expect.facts]]
id = "subtitle"
tag = "p"
display = "block"
# The sentence wraps in the 400px content box at 14px — wrapping is part of
# the structural contract.
text_runs = ["M1 fixture: native window, rectangle, text, resize, DPI,", "frame capture."]
