# M2a fixture: the hello document at 2x DPI. Proves the whole pipeline —
# cascade, block layout, text wrapping — is a pure function of the viewport:
# geometry lands at exactly 2x the 1x device coordinates.
name = "hello-2x"
html = "examples/hello/index.html"
css = ["examples/hello/app.css"]
viewport = { width = 1600, height = 1200, scale = 2.0 }

[expect]
# Regenerated for the M2b Taffy migration: 1x stayed byte-identical; 2x
# baselines moved because Taffy lays out in unrounded f32 (ADR 0007) and
# glyph rasterization at 2x font sizes is not exactly 2x the 1x ink.
pixels_sha256 = "2f49acbacb13908bb2de0fe79692097964286f7ed4a74fa97a243e0a6704a63c"

# Exact-color probes at 2x the 1x coordinates (page bg, card fill, border).
[[expect.pixel]]
pos = [8, 8]
color = "#10141C"

[[expect.pixel]]
pos = [80, 80]
color = "#171D29"

[[expect.pixel]]
pos = [32, 34]
color = "#2A3242"

[[expect.facts]]
id = "card"
tag = "main"
display = "block"
x = 32.0
y = 32.0
width = 872.0            # exactly 2x the 1x border box
# Box-model facts are device pixels: 16 CSS px padding → 32 at 2x.
padding = [32.0, 32.0, 32.0, 32.0]
border = [4.0, 4.0, 4.0, 4.0]
margin = [32.0, 32.0, 32.0, 32.0]
content_x = 68.0
content_y = 68.0
content_width = 800.0

[[expect.facts]]
id = "title"
tag = "h1"
display = "block"
text_runs = ["Hello, VelquView"]

[[expect.facts]]
id = "subtitle"
tag = "p"
display = "block"
text_runs = ["M1 fixture: native window, rectangle, text, resize, DPI,", "frame capture."]
