name = "flex image: intrinsic main size, stretched cross size"

html = "tests/visual/image-flex/index.html"

css = ["tests/visual/image-flex/app.css"]

[viewport]
width = 320
height = 120
scale = 1.0

[assets."red.png"]
format = "png"
width = 40
height = 20
color = "#ef4444"

[expect]
