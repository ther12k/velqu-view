y = 0.0
width = 200.0
height = 30.0

[[expect.facts]]
id = "pic"
tag = "img"
display = "block"
x = 0.0
y = 0.0
width = 40.0
height = 30.0

[[expect.facts]]
id = "grow"
tag = "div"
display = "block"
x = 40.0
y = 0.0
width = 160.0
height = 30.0

[[expect.pixel]]
pos = [20, 15]
color = "#ef4444"

[[expect.pixel]]
pos = [100, 15]
