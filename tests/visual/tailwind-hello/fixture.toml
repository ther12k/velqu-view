name = "tailwind utilities-only document: no CSS files, pipeline compiles everything"

# No `css` table at all: every style comes from utility classes compiled by
# the v0 pipeline (ADR 0009). Pins border-box sizing (w-64 = 256 border box
# including p-4), palette colors, typography, borders, and radius.

html = "tests/visual/tailwind-hello/index.html"

tailwind = true

[viewport]
width = 360
height = 200
scale = 1.0

[expect]
# Migration (M3 review fixes): corners now paint rounded — `rounded-lg`
# clips the card's corners, so the old corner pixel shows page background.
# Facts unchanged; only the corner raster moved.
pixels_sha256 = "47a43958068ea753ff324a4bf2e23b524bc93cd1183dd670a1574188c4942da4"

[[expect.facts]]
id = "card"
tag = "div"
display = "block"
x = 16.0
y = 16.0
width = 256.0

[[expect.facts]]
id = "title"
tag = "h1"
display = "block"
text_runs = ["Hello Tailwind"]

[[expect.facts]]
id = "sub"
tag = "p"
display = "block"
text_runs = ["Rendered by the v0 utility", "pipeline."]

# Page background behind and around the card.
[[expect.pixel]]
pos = [340, 10]
color = "#f1f5f9"

# The extreme corner pixel is now OUTSIDE the rounded-lg (8px) shape:
# page background.
[[expect.pixel]]
pos = [16, 16]
color = "#f1f5f9"

# Straight-zone border pixel (below the corner arc): the card's 1px
# gray-200 border.
[[expect.pixel]]
pos = [16, 60]
color = "#e5e7eb"

# Card interior: white.
[[expect.pixel]]
pos = [100, 60]
color = "#FFFFFF"

[[expect.pixel]]
pos = [200, 150]
color = "#FFFFFF"
