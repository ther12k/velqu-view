<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Velqu Reactive Tabs</title>
</head>
<body class="bg-zinc-950 p-8 text-zinc-100">
  <main
    vx-state="{ tab: 'count', count: 0 }"
    class="max-w-md rounded-xl border border-zinc-800 p-6"
  >
    <h1 class="text-xl font-semibold">Tabs</h1>

    <nav class="mt-6 flex gap-2">
      <button
        id="tab-count"
        @click="tab = 'count'"
        :class="tab == 'count' ? 'rounded-md bg-zinc-800 px-3 py-2 font-medium' : 'rounded-md bg-zinc-900 px-3 py-2 text-zinc-400'"
      >Counter</button>
      <button
        id="tab-about"
        @click="tab = 'about'"
        :class="tab == 'about' ? 'rounded-md bg-zinc-800 px-3 py-2 font-medium' : 'rounded-md bg-zinc-900 px-3 py-2 text-zinc-400'"
      >About</button>
    </nav>

    <section data-vv-test="panel-count" class="mt-6" vx-show="tab == 'count'">
      <div class="flex items-center gap-4">
        <button id="dec" @click="count--" class="rounded-md border border-zinc-700 px-3 py-2">-</button>
        <span data-vv-test="value" class="min-w-12 text-center text-2xl" vx-text="count"></span>
        <button id="inc" @click="count++" class="rounded-md bg-blue-600 px-3 py-2 font-medium">+</button>
      </div>
    </section>

    <section data-vv-test="panel-about" class="mt-6 text-sm text-zinc-400" vx-show="tab == 'about'">
      <p>This panel is shown and hidden by a vx-show binding: one
      structural mutation per switch, at most one layout pass.</p>
    </section>
  </main>
</body>
</html>
